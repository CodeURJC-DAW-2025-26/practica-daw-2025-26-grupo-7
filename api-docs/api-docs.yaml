components:
  schemas:
    UpdateProfileRequestDTO:
      type: object
      properties:
        email:
          type: string
        birthDate:
          type: string
          format: date
    UserDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
        birthDate:
          type: string
          format: date
        roles:
          type: array
          items:
            type: string
        banned:
          type: boolean
        createdAt:
          type: string
          format: date-time
    OrderDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - PENDING
          - SENT_TO_KITCHEN
          - IN_PROGRESS
          - READY
          - DELIVERED
          - CANCELLED
        userId:
          type: integer
          format: int64
        username:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemDTO"
        totalPrice:
          type: number
        tableNumber:
          type: integer
          format: int32
        customerNote:
          type: string
    OrderItemDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        dishId:
          type: integer
          format: int64
        dishName:
          type: string
        quantity:
          type: integer
          format: int32
        unitPrice:
          type: number
        totalPrice:
          type: number
        kitchenNote:
          type: string
        meatPoint:
          type: string
    TableNumberRequestDTO:
      type: object
      properties:
        tableNumber:
          type: integer
          format: int32
    CartItemRequestDTO:
      type: object
      properties:
        dishId:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int32
    TextRequestDTO:
      type: object
      properties:
        value:
          type: string
    DishDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        category:
          type: string
          enum:
          - STARTER
          - MEAT
          - DESSERT
          - DRINK
        name:
          type: string
        description:
          type: string
        allergens:
          type: array
          items:
            type: string
            enum:
            - GLUTEN
            - EGG
            - MILK
            - NUTS
            - FISH
            - SHELLFISH
            - SOY
            - SESAME
        price:
          type: number
        available:
          type: boolean
        image:
          $ref: "#/components/schemas/ImageDTO"
    ImageDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
    CreateUserRequestDTO:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
        password:
          type: string
        birthDate:
          type: string
          format: date
    AuthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - SUCCESS
          - FAILURE
        message:
          type: string
        error:
          type: string
        accessToken:
          type: string
        refreshToken:
          type: string
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
    PageDishDTO:
      type: object
      properties:
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        first:
          type: boolean
        last:
          type: boolean
        numberOfElements:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: "#/components/schemas/DishDTO"
        number:
          type: integer
          format: int32
        sort:
          $ref: "#/components/schemas/SortObject"
        pageable:
          $ref: "#/components/schemas/PageableObject"
        empty:
          type: boolean
    PageableObject:
      type: object
      properties:
        offset:
          type: integer
          format: int64
        sort:
          $ref: "#/components/schemas/SortObject"
        pageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
