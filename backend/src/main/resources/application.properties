spring.application.name=backend

spring.profiles.default=run

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3308/fuegolento?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root1234}

spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.mustache.prefix=classpath:/templates/
spring.mustache.suffix=.html

server.port=8443
server.ssl.key-store=classpath:keystore.jks
server.ssl.key-store-password=password
server.ssl.key-password=password

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.sample-data.enabled=false